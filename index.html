<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Содержимое подставляется динамически в App.tsx под реально активную тему
         (светлая/тёмная), а не только системную — у приложения есть свой переключатель
         темы (экран «Оформление»), независимый от prefers-color-scheme устройства. -->
    <meta name="theme-color" id="theme-color-meta" content="#F4F1FF" />
    <!-- iOS в режиме «На экран Домой»/полноэкранном режиме иначе рисует статус-бар
         непрозрачной чёрной плашкой НАД страницей (вне её DOM, фон страницы туда в
         принципе не достаёт) — с black-translucent статус-бар становится прозрачным
         оверлеем поверх контента, и сквозь него виден фон темы. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Севчик</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
